[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Aurora-Viewer/Aurora-Viewer"
publish = false

# The single local profile: check.ps1 (clippy, tests) and the demo runs share
# it, so a worktree compiles everything once. It behaves like the shipped
# build (no debug assertions or overflow checks, no console window) and only
# skips the slow LTO of --release, kept for releases and performance work.
# Debug info: line tables only (function names and line numbers in crash
# stacks, without the gigabytes of full debug info in target/).
[profile.dev]
opt-level = 1
debug = "line-tables-only"
debug-assertions = false
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3

# The texture decoder is the hot loop of a region's loading, and replaces a
# dependency (OpenJPEG, built with full optimisation like every dependency):
# it is built as one. A small crate without dependents but aurora-assets.
[profile.dev.package.aurora-j2k]
opt-level = 3

# The one exception to the single profile: the viewer crate's own test
# executable, the heaviest compile of the workspace, is built without
# optimisation. It only runs the tests, and the CI builds them unoptimised
# too. Its debug info stays the one of `dev` (line tables), so a failing test
# keeps files and lines in its backtrace. Cargo builds nothing else
# differently: the dependencies, the other crates and the viewer of
# `cargo run` keep the profile above.
[profile.test.package.aurora-viewer]
opt-level = 0

# CI (clippy, tests): the workspace's crates are compiled fast rather than
# running fast; keeps the debug assertions and overflow checks as an extra
# net for the tests.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = false
debug-assertions = true
overflow-checks = true
incremental = false

# The dependencies are optimised a little. They come from the Rust cache and
# are rebuilt only when Cargo.lock or the Rust version changes, and the
# viewer's interface tests spend most of their time in them: on the same
# hosted runner those tests take 158 s instead of 566 s. 1 and not 3: the
# tests run as fast, and a cache built from nothing costs less (TASKS.md,
# task `ci-optimised-deps`, has the measures). Without this section `ci`
# would inherit the 3 of `dev`.
[profile.ci.package."*"]
opt-level = 1

# The texture decoder's tests decode thousands of codestreams with it and
# with OpenJPEG: optimised like the dependencies, they take seconds.
[profile.ci.package.aurora-j2k]
opt-level = 1

# "Debug viewer" of aurora-tools.cmd (target\debugging): a console window,
# debug assertions and overflow checks, full debug info for Aurora's own
# crates (line tables only for the dependencies, to keep it to a few GB).
[profile.debugging]
inherits = "dev"
debug = "full"
debug-assertions = true
overflow-checks = true

[profile.debugging.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 16

# Shared lints: every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Render passes and GPU setup legitimately take many parameters and
# nested tuple types; splitting them would not make the code clearer.
too_many_arguments = "allow"
type_complexity = "allow"

[patch.crates-io]
# Native desktop-file drops need winit 0.31 transfer IDs and positions.
# Pin the egui winit-0.31 bridge (emilk/egui#8767) and its matching
# accessibility adapter together; all revisions are fixed in Cargo.lock.
egui = { git = "https://github.com/Minuit-Ferina/egui", rev = "c3e8dd7ad0d04c0cce1b6a5d05c13d001b7c8081" }
egui-winit = { git = "https://github.com/Minuit-Ferina/egui", rev = "c3e8dd7ad0d04c0cce1b6a5d05c13d001b7c8081" }
egui-wgpu = { git = "https://github.com/Minuit-Ferina/egui", rev = "c3e8dd7ad0d04c0cce1b6a5d05c13d001b7c8081" }
accesskit = { git = "https://github.com/Minuit-Ferina/accesskit", rev = "c1db9954a14db195ca42518c86ece6e32a8b753e" }
# wgpu 30.0.1 includes Aurora's Intel empty-pool fix and ray-tracing instance flags.
# The fork adds opt-in Vulkan resize scaling for Windows surfaces.
# All wgpu and Naga crates come from the same revision.
naga = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
naga-types = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
wgpu = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
wgpu-core = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
wgpu-core-deps-apple = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
wgpu-core-deps-emscripten = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
wgpu-core-deps-wasm = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
wgpu-hal = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
wgpu-naga-bridge = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
wgpu-types = { git = "https://github.com/Minuit-Ferina/wgpu", rev = "170ddeef6a796335ad2997d5c1d792e775e2ef01" }
