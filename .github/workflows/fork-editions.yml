name: Fork editions
# One-off publication of a pre-verified distribution on the fork.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-patch-0-4-0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Minuit-Ferina/Aurora-Viewer' && github.ref == 'refs/heads/chore/release-patch-0-4-0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE: c41042a008a3e92471f29cc05a1d60c2cd1b9c7d
      TAG: v0.9.11+patch.0.4.0
      RELEASE_ID: '453218622'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c41042a008a3e92471f29cc05a1d60c2cd1b9c7d
          fetch-depth: 1
          persist-credentials: true
      - name: Verify the exact draft and uploaded assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$TAG" --arg source "$SOURCE" \
              '.draft and (.prerelease | not) and .tag_name == $tag and .target_commitish == $source' >/dev/null
          cat > "$RUNNER_TEMP/expected-assets.json" <<'JSON'
          [{"name":"Aurora-Viewer-Classic-v0.9.11+patch.0.4.0-windows-x64.zip","size":95298989,"digest":"sha256:efbbdb06be12106b14e164faf04930d3376478f71056788f053ad6f3df05c099"},{"name":"Aurora-Viewer-Classic-v0.9.11+patch.0.4.0-windows-x64.zip.sha256","size":124,"digest":"sha256:d664bd22f565ef01156025286820ee3eb79faf6e8941be747031c975d91a186e"},{"name":"Aurora-Viewer-Classic-v0.9.11+patch.0.4.0-linux-x64.tar.gz","size":225009360,"digest":"sha256:71c0b8d815d33134bce563ee5681c8f4bf7630700ba81628768c19e67b2967ba"},{"name":"Aurora-Viewer-Classic-v0.9.11+patch.0.4.0-linux-x64.tar.gz.sha256","size":125,"digest":"sha256:3a4188d38544ebc73b52e6a0d34e97447b5628800a858387f7edef9c8ecab3e7"},{"name":"Aurora-Viewer-Classic-v0.9.11+patch.0.4.0-macos-arm64.zip","size":89637419,"digest":"sha256:27d316a515f40cf1e5ca0346f061761b021b15887030cb30da79c44f9ffa9d5b"},{"name":"Aurora-Viewer-Classic-v0.9.11+patch.0.4.0-macos-arm64.zip.sha256","size":124,"digest":"sha256:56d005c673cad8ef7042807b600e2e163acd442f9672197b6238491b0c848f54"},{"name":"Aurora-Viewer-FTRLV-v0.9.11+patch.0.4.0-windows-x64.zip","size":95358897,"digest":"sha256:9b7254260115877b27f11c6010246282c38ff430ffd7639fe37391b4bb2520ba"},{"name":"Aurora-Viewer-FTRLV-v0.9.11+patch.0.4.0-windows-x64.zip.sha256","size":122,"digest":"sha256:c410de41246a80d38359bb8e7f62d7c73d85ebc908eb79aecfd9536fa8198b33"},{"name":"Aurora-Viewer-FTRLV-v0.9.11+patch.0.4.0-linux-x64.tar.gz","size":225020801,"digest":"sha256:265a9c695040a3319841a8666f15b7abbc41048f6f395c644d0b1c0ab57466e6"},{"name":"Aurora-Viewer-FTRLV-v0.9.11+patch.0.4.0-linux-x64.tar.gz.sha256","size":123,"digest":"sha256:1454df5f9307233fe67a23c5790f6087ba588ef7d89e4e4218e932163fc81924"},{"name":"Aurora-Viewer-FTRLV-v0.9.11+patch.0.4.0-macos-arm64.zip","size":89526412,"digest":"sha256:4d1ead9c055c587139a0d81319f11a20c2fd1004c767896c443139ad4d214842"},{"name":"Aurora-Viewer-FTRLV-v0.9.11+patch.0.4.0-macos-arm64.zip.sha256","size":122,"digest":"sha256:987f9bef502ad840ac00dfcb452b8bbb0344ebc31e52ff3d6ab19ce197b06683"}]
          JSON
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" |
            jq -ec 'if length == 12 and all(.[]; .state == "uploaded") then
                map({name,size,digest}) | sort_by(.name)
              else error("Unexpected draft asset list") end' > "$RUNNER_TEMP/actual-assets.json"
          jq -ec 'sort_by(.name)' "$RUNNER_TEMP/expected-assets.json" > "$RUNNER_TEMP/sorted-assets.json"
          cmp "$RUNNER_TEMP/sorted-assets.json" "$RUNNER_TEMP/actual-assets.json"
      - name: Tag the tested source and publish
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG"
          existing="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")"
          if [[ -z "$existing" ]]; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                tag -a "$TAG" "$SOURCE" -m 'Aurora Viewer 0.9.11 - Patch 0.4.0'
            git push origin "$tag_ref"
          fi
          tagged="$(git ls-remote origin "$tag_ref^{}" | cut -f1)"
          test "$tagged" = "$SOURCE"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$TAG" '(.draft | not) and (.prerelease | not) and .tag_name == $tag' >/dev/null
