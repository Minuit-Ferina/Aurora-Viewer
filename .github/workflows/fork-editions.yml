name: Fork editions
# One-off publication of a pre-verified distribution on the fork.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-patch-0-4-2
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Minuit-Ferina/Aurora-Viewer' && github.ref == 'refs/heads/chore/release-patch-0-4-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE: b0cae89f674c319d81675eb0331f4f944640b287
      TAG: v0.9.13+patch.0.4.2
      RELEASE_ID: '456764684'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b0cae89f674c319d81675eb0331f4f944640b287
          fetch-depth: 1
          persist-credentials: true
      - name: Verify the exact draft and uploaded assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$TAG" --arg source "$SOURCE" \
              '.draft and (.prerelease | not) and .tag_name == $tag and .target_commitish == $source' >/dev/null
          cat > "$RUNNER_TEMP/expected-assets.json" <<'JSON'
          [{"name":"Aurora-Viewer-Classic-v0.9.13+patch.0.4.2-linux-x64.tar.gz","size":253829091,"digest":"sha256:0eda667c4825c11ab99adaf35a65d8c274a8ac4ce4db8f072efc7b02cd4fb623"},{"name":"Aurora-Viewer-Classic-v0.9.13+patch.0.4.2-linux-x64.tar.gz.sha256","size":125,"digest":"sha256:ffc47e461e501a128914aab3f65cae6ac537b9b0d70aa5333ce793a2033c5fa1"},{"name":"Aurora-Viewer-FTRLV-v0.9.13+patch.0.4.2-linux-x64.tar.gz","size":253770568,"digest":"sha256:4bfca48dea6c29b449a479a8fe7f79b487e17c74e477944096913806af4c462f"},{"name":"Aurora-Viewer-FTRLV-v0.9.13+patch.0.4.2-linux-x64.tar.gz.sha256","size":123,"digest":"sha256:2d4591cd127b4f398a2a9cd8360916c0f0cb26e2acaa3cb9a82612e560057ea0"},{"name":"Aurora-Viewer-FTRLV-v0.9.13+patch.0.4.2-windows-x64.zip","size":116616558,"digest":"sha256:5646a0905101dada9d149241cb4fa6612e9a34377f81d3f5c50a816520102858"},{"name":"Aurora-Viewer-FTRLV-v0.9.13+patch.0.4.2-windows-x64.zip.sha256","size":122,"digest":"sha256:a2d3dac369c8c0525ca6d5dc196796e2c71e9fe256c0b11a47c097472be9488b"},{"name":"Aurora-Viewer-Classic-v0.9.13+patch.0.4.2-windows-x64.zip","size":116572177,"digest":"sha256:d3963203a536fbdb43650213de037b327a022a3e277cb33d93429b2ba66db9f6"},{"name":"Aurora-Viewer-Classic-v0.9.13+patch.0.4.2-windows-x64.zip.sha256","size":124,"digest":"sha256:42249df7e66f241243fe17177f7060bfbb0216dc4f527def163493e523a96a67"},{"name":"Aurora-Viewer-Classic-v0.9.13+patch.0.4.2-macos-arm64.zip","size":110967145,"digest":"sha256:e073b25a4fef643c51d3a36b5e7050120503f1bfd8dc30ac11c310920a649ca8"},{"name":"Aurora-Viewer-Classic-v0.9.13+patch.0.4.2-macos-arm64.zip.sha256","size":124,"digest":"sha256:03192a1f80fc78aae09d58619b95ac13c323bd090b6478c73dbf7135fcab9bfc"},{"name":"Aurora-Viewer-FTRLV-v0.9.13+patch.0.4.2-macos-arm64.zip","size":110780420,"digest":"sha256:2862e6212bce64635b2aaee5bdb935f9048011ddb2364a021df311edb3185ec8"},{"name":"Aurora-Viewer-FTRLV-v0.9.13+patch.0.4.2-macos-arm64.zip.sha256","size":122,"digest":"sha256:e6de742a4d73621a7ddc71890e5150433406e8ddff810135661cb9c39facacd1"}]
          JSON
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" |
            jq -ec 'if length == 12 and all(.[]; .state == "uploaded") then
                map({name,size,digest}) | sort_by(.name)
              else error("Unexpected draft asset list") end' > "$RUNNER_TEMP/actual-assets.json"
          jq -ec 'sort_by(.name)' "$RUNNER_TEMP/expected-assets.json" > "$RUNNER_TEMP/sorted-assets.json"
          cmp "$RUNNER_TEMP/sorted-assets.json" "$RUNNER_TEMP/actual-assets.json"
      - name: Tag the tested source and publish
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG"
          existing="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")"
          if [[ -z "$existing" ]]; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                tag -a "$TAG" "$SOURCE" -m 'Aurora Viewer 0.9.13 - Patch 0.4.2'
            git push origin "$tag_ref"
          fi
          tagged="$(git ls-remote origin "$tag_ref^{}" | cut -f1)"
          test "$tagged" = "$SOURCE"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$TAG" '(.draft | not) and (.prerelease | not) and .tag_name == $tag' >/dev/null
