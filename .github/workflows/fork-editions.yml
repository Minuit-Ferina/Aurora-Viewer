name: Fork editions
on:
  pull_request:
    branches: [develop]
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/fork-editions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editions:
    if: github.repository == 'Minuit-Ferina/Aurora-Viewer'
    name: ${{ matrix.edition }} on ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
        edition: [classic, ftrlv]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup component add clippy rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          name: fork-edition-${{ matrix.edition }}
      - name: Check compiled edition
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./scripts/check.ps1 -CI -Edition ${{ matrix.edition }}
      - name: Build archive
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/build-edition.ps1 -Edition ${{ matrix.edition }} -Out "${{ runner.temp }}/dist" -Release
      - name: Upload archive and checksum
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurora-${{ matrix.edition }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.sha256
          if-no-files-found: error