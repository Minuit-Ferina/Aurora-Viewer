name: Fork editions
# One-off publication of a pre-verified distribution on the fork.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-patch-0-4-1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Minuit-Ferina/Aurora-Viewer' && github.ref == 'refs/heads/chore/release-patch-0-4-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE: 730bcb797641064b265a69e16163fde049b57ed3
      TAG: v0.9.12+patch.0.4.1
      RELEASE_ID: '453818924'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 730bcb797641064b265a69e16163fde049b57ed3
          fetch-depth: 1
          persist-credentials: true
      - name: Verify the exact draft and uploaded assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$TAG" --arg source "$SOURCE" \
              '.draft and (.prerelease | not) and .tag_name == $tag and .target_commitish == $source' >/dev/null
          cat > "$RUNNER_TEMP/expected-assets.json" <<'JSON'
          [{"name":"Aurora-Viewer-Classic-v0.9.12+patch.0.4.1-windows-x64.zip","size":112524034,"digest":"sha256:bf55ce1e42beb6997e38a5655dc411016da663a8a046a55b1ad15154724bdfd9"},{"name":"Aurora-Viewer-Classic-v0.9.12+patch.0.4.1-windows-x64.zip.sha256","size":124,"digest":"sha256:18fa7ff5ba313afbeeb27baf5010118f4a3265766fc7ad606e45e34189aa7ef6"},{"name":"Aurora-Viewer-Classic-v0.9.12+patch.0.4.1-linux-x64.tar.gz","size":241499962,"digest":"sha256:421173893acbc7d6a2afbe956ddc8e69b713e157a2228ae182c5f10dbf894d45"},{"name":"Aurora-Viewer-Classic-v0.9.12+patch.0.4.1-linux-x64.tar.gz.sha256","size":125,"digest":"sha256:fa7186a113847473384ec1c9957d2e0a1b3f69dc2f36e02201c6c8ea5de7b422"},{"name":"Aurora-Viewer-Classic-v0.9.12+patch.0.4.1-macos-arm64.zip","size":107506106,"digest":"sha256:00789feb3005ec8c0a760ffe74cd7155d879de48cecf5730efd2d2e4676155fb"},{"name":"Aurora-Viewer-Classic-v0.9.12+patch.0.4.1-macos-arm64.zip.sha256","size":124,"digest":"sha256:557da6044687c56d7e47733be745c93f865d45d67822b4aba53c445f981ade0e"},{"name":"Aurora-Viewer-FTRLV-v0.9.12+patch.0.4.1-windows-x64.zip","size":112509358,"digest":"sha256:a640647d96b00e6f856a00d7e12b813ff3f486df52e7957f85e7f96b092bfde4"},{"name":"Aurora-Viewer-FTRLV-v0.9.12+patch.0.4.1-windows-x64.zip.sha256","size":122,"digest":"sha256:3b5bb3cbbcf4abff9fa21dac0efa2e71ef9748bf6db1712de051b799e73d814e"},{"name":"Aurora-Viewer-FTRLV-v0.9.12+patch.0.4.1-linux-x64.tar.gz","size":241400330,"digest":"sha256:42516b1a3b0be4826953e2f3310659aa0259f463e5523c1336d686651000551a"},{"name":"Aurora-Viewer-FTRLV-v0.9.12+patch.0.4.1-linux-x64.tar.gz.sha256","size":123,"digest":"sha256:9fbb74832c87970eb73eee6140ca06c246191e6e5ab7402a10c54238507c0c5d"},{"name":"Aurora-Viewer-FTRLV-v0.9.12+patch.0.4.1-macos-arm64.zip","size":107583336,"digest":"sha256:af3a6d36ee758c100da865205fa1349be1c98c8c11fc1c77f28672c525a1b139"},{"name":"Aurora-Viewer-FTRLV-v0.9.12+patch.0.4.1-macos-arm64.zip.sha256","size":122,"digest":"sha256:ed7a954662381d6852f0416925b2fc22fa1dc821e1ec33009fd468cbdb77fadc"}]
          JSON
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" |
            jq -ec 'if length == 12 and all(.[]; .state == "uploaded") then
                map({name,size,digest}) | sort_by(.name)
              else error("Unexpected draft asset list") end' > "$RUNNER_TEMP/actual-assets.json"
          jq -ec 'sort_by(.name)' "$RUNNER_TEMP/expected-assets.json" > "$RUNNER_TEMP/sorted-assets.json"
          cmp "$RUNNER_TEMP/sorted-assets.json" "$RUNNER_TEMP/actual-assets.json"
      - name: Tag the tested source and publish
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG"
          existing="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")"
          if [[ -z "$existing" ]]; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                tag -a "$TAG" "$SOURCE" -m 'Aurora Viewer 0.9.12 - Patch 0.4.1'
            git push origin "$tag_ref"
          fi
          tagged="$(git ls-remote origin "$tag_ref^{}" | cut -f1)"
          test "$tagged" = "$SOURCE"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$TAG" '(.draft | not) and (.prerelease | not) and .tag_name == $tag' >/dev/null
