name: Native-window test builds
run-name: Native-window test builds - ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      linux_release:
        description: Build the previous Linux test source using the release profile
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-window-test-builds
  cancel-in-progress: true

jobs:
  package:
    if: ${{ !inputs.linux_release }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            runner: ubuntu-24.04
            cache: linux-tests
            archive: aurora-viewer-linux-x64.tar.gz
          - platform: macOS arm64
            runner: macos-15
            cache: macos-tests
            archive: aurora-viewer-macos-arm64.zip
    env:
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup update stable --no-self-update
      - uses: ./.github/actions/rust-cache
        with:
          name: ${{ matrix.cache }}
      - name: Build
        run: cargo build --profile ci --locked -p aurora-viewer
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Exe target/ci/aurora-viewer -Out Aurora-Viewer
          tar -czf $env:ARCHIVE Aurora-Viewer
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="Aurora Viewer.app"
          pwsh -NoProfile -File scripts/package-macos.ps1 -Exe target/ci/aurora-viewer -Out "$app"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/aurora-viewer" --version
          ditto -c -k --keepParent "$app" "$ARCHIVE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}-${{ github.sha }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Offline demo on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 12
        env:
          AURORA_DEMO: '1'
          RUST_LOG: warn,aurora_viewer::app::native_windows=info
          AURORA_DEMO_NATIVE_WINDOWS: '2'
          AURORA_CAPTURE: ${{ runner.temp }}/macos-native-demo.png
          AURORA_CAPTURE_FRAMES: '620'
          AURORA_CAPTURE_EXIT: '1'
        run: |
          "Aurora Viewer.app/Contents/MacOS/aurora-viewer" --title 'Test native-detachable-windows macOS [AUTOMATION - DO NOT TOUCH]' --language en
          test -s "$AURORA_CAPTURE"
          logs="$HOME/Library/Application Support/org.Aurora.AuroraViewer/logs"
          opens=$(grep -rh --include='aurora-demo-*.log' 'native UI opened a desktop panel' "$logs" | wc -l)
          test "$opens" -ge 2
      - name: macOS demo capture
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-native-demo
          path: ${{ runner.temp }}/macos-native-demo.png
          if-no-files-found: error
          retention-days: 14
      - name: Linux caption hit testing
        if: runner.os == 'Linux'
        run: cargo test --profile ci --workspace --locked linux_caption_resize_hits_edges_and_corners_at_display_scale

  linux-release:
    if: ${{ inputs.linux_release }}
    name: Linux x64 release comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: eecd8ecec0e9fa9b4375f0463dd0c59fbcd7c1ee
          fetch-depth: 0
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: |
          test "$(git rev-parse HEAD)" = eecd8ecec0e9fa9b4375f0463dd0c59fbcd7c1ee
          cargo build --release --locked -p aurora-viewer
          target/release/aurora-viewer --version
      - name: Package Linux
        shell: pwsh
        run: |
          $dir = 'Aurora-Viewer-linux-x64-release-eecd8ece'
          ./scripts/package.ps1 -Exe target/release/aurora-viewer -Out $dir
          & tar -czf "$dir.tar.gz" $dir
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurora-viewer-linux-x64-release-eecd8ece
          path: Aurora-Viewer-linux-x64-release-eecd8ece.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
