name: Native-window test builds
run-name: Native-window test builds - ${{ github.sha }}

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: native-window-macos-intel-test-builds
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS x64 tests and arm64 cross-build
            runner: macos-15-intel
            cache: macos-intel-cross-tests
            archive: aurora-viewer-macos-arm64.zip
    env:
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup update stable --no-self-update
      - uses: ./.github/actions/rust-cache
        with:
          name: ${{ matrix.cache }}
      - name: Build
        run: cargo build --profile ci --locked -p aurora-viewer
      - name: Shared native window tests
        run: |
          cargo test --profile ci --workspace --locked app::native_windows::
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Exe target/ci/aurora-viewer -Out Aurora-Viewer
          tar -czf $env:ARCHIVE Aurora-Viewer
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
      - name: Cross-compile for Apple Silicon
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --profile ci --locked --target aarch64-apple-darwin -p aurora-viewer
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="Aurora Viewer.app"
          pwsh -NoProfile -File scripts/package-macos.ps1 -Exe target/ci/aurora-viewer -Out "$app"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/aurora-viewer" --version
          cp target/aarch64-apple-darwin/ci/aurora-viewer "$app/Contents/MacOS/aurora-viewer"
          xcrun lipo -verify_arch arm64 "$app/Contents/MacOS/aurora-viewer"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" "$ARCHIVE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}-${{ github.sha }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
