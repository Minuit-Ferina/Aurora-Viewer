name: Aurora macOS test packages
run-name: Aurora macOS test packages - ${{ github.sha }}

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: native-window-macos-test-packages
  cancel-in-progress: true

jobs:
  package:
    name: Package Aurora for Intel and Apple Silicon
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: ./.github/actions/rust-cache
        with:
          name: macos-intel-cross-tests
      - name: Build and package for Intel
        run: |
          cargo build --profile ci --locked -p aurora-viewer
          app="Aurora Viewer.app"
          binary="$app/Contents/MacOS/aurora-viewer"
          pwsh -NoProfile -File scripts/package-macos.ps1 -Exe target/ci/aurora-viewer -Out "$app"
          test "$(xcrun lipo -archs "$binary")" = x86_64
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          "$binary" --version
          ditto -c -k --keepParent "$app" aurora-viewer-macos-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurora-viewer-macos-x64.zip-${{ github.sha }}
          path: aurora-viewer-macos-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build and package for Apple Silicon
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --profile ci --locked --target aarch64-apple-darwin -p aurora-viewer
          app="Aurora Viewer.app"
          binary="$app/Contents/MacOS/aurora-viewer"
          cp target/aarch64-apple-darwin/ci/aurora-viewer "$binary"
          test "$(xcrun lipo -archs "$binary")" = arm64
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" aurora-viewer-macos-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurora-viewer-macos-arm64.zip-${{ github.sha }}
          path: aurora-viewer-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Offline Intel demo
        timeout-minutes: 8
        env:
          AURORA_DEMO: '1'
          RUST_LOG: warn,aurora_viewer::app::native_windows=info
          AURORA_DEMO_NATIVE_WINDOWS: '2'
          AURORA_CAPTURE: ${{ runner.temp }}/macos-intel-native-demo.png
          AURORA_CAPTURE_FRAMES: '620'
          AURORA_CAPTURE_EXIT: '1'
        run: |
          ditto -x -k aurora-viewer-macos-x64.zip intel-test
          'intel-test/Aurora Viewer.app/Contents/MacOS/aurora-viewer' --title 'Test native-detachable-windows macOS Intel [AUTOMATION - DO NOT TOUCH]' --language en
          test -s "$AURORA_CAPTURE"
          logs="$HOME/Library/Application Support/org.Aurora.AuroraViewer/logs"
          opens=$(grep -rh --include='aurora-demo-*.log' 'native UI opened a desktop panel' "$logs" | wc -l)
          test "$opens" -ge 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-intel-native-demo
          path: ${{ runner.temp }}/macos-intel-native-demo.png
          if-no-files-found: error
          retention-days: 14
